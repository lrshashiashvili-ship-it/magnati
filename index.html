<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>თბილისელი მაგნატი</title>
<meta name="description" content="ქართული ეკონომიკური სამაგიდო თამაში: იყიდე თბილისის უბნები, ითამაშე კომპიუტერთან ან მეგობრებთან ონლაინ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316285F'/%3E%3Crect x='14' y='14' width='36' height='36' rx='8' fill='%23E8B758'/%3E%3Ccircle cx='25' cy='25' r='4' fill='%23B42647'/%3E%3Ccircle cx='39' cy='39' r='4' fill='%23B42647'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23B42647'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="მაგნატი">
<meta name="theme-color" content="#000000">
<script src="config.js"></script>
</head>
<body>
<title>თბილისელი მაგნატი</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Noto+Serif+Georgian:wght@600;800;900&display=swap">
<style>
/* Layout: Tbilisi at night. A tilted 3D walnut-framed board (24 illustrated night scenes, panorama desk in the middle) beside a ledger column; ledger drops below on phones. Single deliberate dark look. */
:root{
  color-scheme:dark;
  --bg:#000000; --panel:#0A0F22; --panel2:#0F1830; --line:#2A3A72; --cream:#F1E8D2; --muted:#94A1C8;
  --cell-a:#18296A; --cell-b:#0E1A48; --seam:#B8913C;
  --gold:#D9B254; --gold-hi:#F6DA8E; --gold-deep:#9C7426; --wine:#C42B4E; --teal:#2AA6B0; --teal-deep:#157780;
  --display:"Noto Serif Georgian","Sylfaen",Georgia,serif;
  --body:"Noto Sans Georgian","Sylfaen",system-ui,sans-serif;
  --tilt:24deg;
}
@media (max-width:640px){:root{--tilt:15deg}}
body.flat{--tilt:0deg;--fit:1}
html,body{background:var(--bg);color:var(--cream)}
body{font-family:var(--body);font-size:14px;line-height:1.45;
  background:#000;
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:899px), (max-height:560px){.stage{order:1}.colR{order:2}.colL{order:3}}
.num{font-variant-numeric:tabular-nums}

/* ---------- 3D stage ---------- */
.stage{position:relative;perspective:2000px;perspective-origin:50% 50%;padding-block:4px 18px}
.frame{position:relative;max-width:780px;margin:0 auto;padding:clamp(7px,1.5vw,16px);border-radius:22px;
  transform:rotateX(var(--tilt)) scale(var(--fit,.94));transform-origin:50% 50%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1);
  background:linear-gradient(145deg,#F2D57E 0%,#B08A36 28%,#E6C56C 52%,#8C6A22 78%,#DDB65A 100%);
  box-shadow:0 1px 0 #FFF0B8 inset,0 2px 0 #8C6A22,0 4px 0 #7E5E1C,0 6px 0 #6E5016,0 8px 0 #5E4412,0 10px 0 #4E380E,0 12px 0 #3E2C0A,0 40px 70px rgba(0,0,0,.75)}
.frame::before{content:"";position:absolute;inset:clamp(2px,.5vw,5px);border-radius:18px;pointer-events:none;
  background:radial-gradient(circle,#C42B4E 0 2.1px,transparent 2.6px) 0 0/16px 16px,radial-gradient(circle,#1E9AA0 0 2.1px,transparent 2.6px) 8px 8px/16px 16px;opacity:.9}
.board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:3px;
  background:linear-gradient(135deg,#E6C56C,#9C7426 50%,#D9B254);border:3px solid #7A5A1A;border-radius:12px;transform-style:preserve-3d;box-shadow:0 0 0 1px #F6DA8E}

.cell{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border:0;padding:0;margin:0;
  background:linear-gradient(180deg,var(--cell-a),var(--cell-b));color:var(--cream);font-family:inherit;cursor:pointer;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 12px rgba(0,0,0,.35);transition:filter .15s}
.cell:hover{filter:brightness(1.18)}
.cell:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;z-index:3}
.cell.sel{box-shadow:inset 0 0 0 3px var(--gold-hi),0 0 20px rgba(246,218,142,.55)}
.cell.rTL{border-top-left-radius:9px}.cell.rTR{border-top-right-radius:9px}.cell.rBL{border-bottom-left-radius:9px}.cell.rBR{border-bottom-right-radius:9px}
.band{height:13%;flex:none;background:var(--gc);display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 10px color-mix(in srgb,var(--gc) 60%,transparent)}
.fls{display:flex;gap:2px;align-items:center;justify-content:center}
.fl{width:max(5px,calc(var(--u) * 1.15));height:max(5px,calc(var(--u) * 1.15));filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));background:#fff;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.fl.max{background:var(--gold-hi)}
.scene{flex:1 1 auto;min-height:0;margin:2px 2px 0;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.scene svg{display:block;width:100%;height:100%}
.board{--u:7px}
.cname{flex:none;font-weight:800;font-size:max(6px,calc(var(--u) * 1.18));line-height:1.12;padding:4% 4% 0;overflow-wrap:anywhere;color:#FFF6E0;text-shadow:0 1px 2px rgba(0,0,0,.7);letter-spacing:.01em}
.cprice{flex:none;align-self:center;font-size:max(5.5px,calc(var(--u) * 1.05));color:var(--gold-hi);margin:3% auto 6%;padding:.1em .6em;border-radius:999px;background:rgba(3,8,26,.55);box-shadow:inset 0 0 0 1px rgba(217,178,84,.5);font-variant-numeric:tabular-nums;font-weight:800;line-height:1.35}
.cprice:empty{display:none}
.cell.corner .cprice{background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,241,210,.45)}
.flag{position:absolute;right:0;top:13%;width:0;height:0;border-left:clamp(9px,1.9vw,17px) solid transparent;border-top:clamp(9px,1.9vw,17px) solid var(--pc);z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.own{box-shadow:inset 0 -3px 0 var(--pc)}
.cell.m .scene{filter:grayscale(.85) brightness(.6)}
.cell.m::after{content:"დაგირავ.";position:absolute;left:0;right:0;top:34%;font-size:clamp(6px,1vw,9.5px);font-weight:800;color:#fff;background:rgba(178,58,72,.85);padding:1px 0;letter-spacing:.04em}
.cell.corner{background:linear-gradient(160deg,var(--c1),var(--c2));justify-content:center}
.cell.corner .ico,.cell.special .ico{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10% 14% 2%;color:var(--gold-hi)}
.cell.corner .ico{color:#FFF1D2}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(255,210,120,.55))}
.ico svg .f{fill:currentColor;fill-opacity:.18}
.ico svg .s{fill:currentColor;stroke:none}
.cell.corner .cname{font-family:var(--display);font-weight:900;font-size:max(6.5px,calc(var(--u) * 1.3))}
.cell.special .cname{font-size:max(6px,calc(var(--u) * 1.2))}
.cell.corner .cprice{color:rgba(255,241,210,.85)}
.cell.special .cname{color:var(--gold-hi)}

/* tokens */
.tklayer{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;z-index:6;transform:translateZ(18px)}
.tk{position:absolute;width:4.5%;aspect-ratio:40/48;transform:translate(-50%,-78%);transition:left .2s cubic-bezier(.3,.7,.3,1),top .2s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.tk-base{position:absolute;left:8%;right:8%;bottom:-8%;height:24%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 50%,#000));box-shadow:0 3px 6px rgba(0,0,0,.7)}
.tk.cur .tk-base{box-shadow:0 0 0 2px var(--gold-hi),0 0 14px 3px rgba(255,216,137,.7),0 3px 6px rgba(0,0,0,.7)}
.tk-fig{position:absolute;inset:0;transform-origin:50% 92%;transform:rotateX(calc(var(--tilt) * -1))}
.tk-hop{width:100%;height:100%}
.tk-hop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.tk.hop .tk-hop{animation:hop .22s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-34%) scale(1.06)}100%{transform:translateY(0)}}
.tk.out{display:none}

/* desk */
.desk{grid-area:2/2/10/10;position:relative;overflow:hidden;container-type:size;color:var(--cream);border-radius:3px;
  background:radial-gradient(120% 90% at 70% 0%,#203677 0%,#0F1D4A 45%,#081130 100%)}
.pano{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.desk-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(4px,2.6cqh,18px);padding:6cqh 5cqw 1.5cqh;text-align:center}
.brand{font-family:var(--display);font-weight:900;font-size:clamp(14px,7.6cqw,46px);line-height:1;letter-spacing:.01em;
  background:linear-gradient(180deg,#FFE7AE 10%,#E8B758 55%,#A87A26 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(232,183,88,.35))}
.brand .orn{display:block;font-family:var(--body);font-weight:600;font-size:clamp(6.5px,2.3cqw,12px);letter-spacing:.24em;color:var(--teal);margin-top:.6em;-webkit-text-fill-color:var(--teal);background:none}
.dice{display:flex;gap:clamp(14px,7cqw,40px);perspective:560px;margin-top:.5cqh;padding:2.6cqh 6cqw 3.6cqh;border-radius:999px;position:relative;
  background:radial-gradient(ellipse at 50% 35%,#1E3780 0%,#0D1A45 60%,#081130 100%);
  box-shadow:inset 0 0 0 2px rgba(217,178,84,.6),inset 0 0 0 5px rgba(8,17,48,.9),inset 0 0 0 6px rgba(217,178,84,.25),inset 0 8px 22px rgba(0,0,0,.65),0 6px 18px rgba(0,0,0,.45)}
.dwrap{--ds:clamp(30px,12.5cqw,72px);position:relative;width:var(--ds);height:var(--ds)}
.dice,.dice *,.pano,.dsum{pointer-events:none}
.actslot{flex:none;min-height:2.6em}
.hud{position:absolute;left:50%;top:50%;transform:translateX(-50%);z-index:10;display:flex;justify-content:center;width:max-content;max-width:90%;transition:top .25s,left .25s}
.hud .acts .btn{font-size:clamp(12px,1.05vw,16px)}
.hud:empty,.hud .acts:empty{display:none}
.core{position:absolute;inset:4%;background:#A97F2A;border-radius:12%}
.core.c2{transform:rotateX(90deg)}.core.c3{transform:rotateY(90deg)}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.08) 32%,rgba(255,255,255,0) 50%,rgba(0,0,0,.12) 100%)}
.dsum{min-height:1.2em;font-family:var(--display);font-weight:900;font-size:clamp(11px,4.2cqw,24px);color:var(--gold-hi);text-shadow:0 2px 8px rgba(0,0,0,.6);line-height:1.2;margin-top:-.4cqh}
.dsum.pop{animation:sumpop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes sumpop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.dsh{position:absolute;left:2%;right:2%;bottom:-26%;height:24%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,0) 70%)}
.die{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.dice.throw .die{animation:toss 1.05s cubic-bezier(.22,.8,.3,1)}
.dice.throw .dsh{animation:shad 1.05s cubic-bezier(.22,.8,.3,1)}
.dice.throw .dwrap:nth-child(2) .die,.dice.throw .dwrap:nth-child(2) .dsh{animation-delay:.07s}
@keyframes toss{0%{transform:translate(0,0)}22%{transform:translate(-8%,-70%)}50%{transform:translate(4%,0)}64%{transform:translate(6%,-20%)}78%{transform:translate(8%,0)}88%{transform:translate(8%,-5%)}100%{transform:translate(0,0)}}
@keyframes shad{0%{transform:scale(1);opacity:1}22%{transform:scale(.5);opacity:.35}50%{transform:scale(1);opacity:1}64%{transform:scale(.8);opacity:.7}78%,100%{transform:scale(1);opacity:1}}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(22deg)}
.face{position:absolute;inset:0;border-radius:17%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13%;
  background:radial-gradient(circle at 30% 22%,#FFF4C8 0%,#EECB70 34%,#C99E40 72%,#8E6A20 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,244,200,.8),inset 0 0 0 3.5px rgba(140,100,30,.35),inset 0 -5px 9px rgba(80,52,8,.5),inset 0 4px 7px rgba(255,255,255,.4);backface-visibility:hidden}
.face span{border-radius:50%;margin:12%}
.face span{margin:11%}
.face span.on{background:radial-gradient(circle at 38% 32%,#FF8496 0%,#C42B4E 45%,#5E0A1C 100%);box-shadow:inset 0 2px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,244,200,.7)}
.face.f1 span.on{background:radial-gradient(circle at 38% 32%,#A8F4F0 0%,#1E9AA0 45%,#0A4248 100%);margin:2%}
.f1{transform:translateZ(calc(var(--ds) / 2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--ds) / 2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--ds) / 2))}.f4{transform:rotateY(-90deg) translateZ(calc(var(--ds) / 2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--ds) / 2))}.f5{transform:rotateX(-90deg) translateZ(calc(var(--ds) / 2))}
.msg{font-size:clamp(9px,3.2cqw,16px);max-width:34ch;text-wrap:balance;line-height:1.35;min-height:2.7em;font-weight:500;color:#E5DECD;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.msg b{color:var(--gold-hi);font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:clamp(5px,2cqw,10px);justify-content:center}
.round{display:none;font-size:clamp(7px,2.1cqw,11px);color:#9AA6C6;letter-spacing:.16em;font-weight:600;margin-top:.4em;text-shadow:0 1px 3px #000}

.btn{font:inherit;font-weight:700;font-size:clamp(10px,3cqw,14px);border:0;border-radius:11px;padding:.65em 1.25em;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#45C2BF,var(--teal-deep));box-shadow:0 3px 0 #0F4847,0 6px 14px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0F4847}
.btn.gold{color:#2A1806;background:linear-gradient(180deg,#FFE09A,var(--gold) 45%,var(--gold-deep));box-shadow:0 3px 0 #6E4F16,0 6px 16px rgba(232,183,88,.25)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 #6E4F16}
.btn.red{background:linear-gradient(180deg,#D45A68,#8E2433);box-shadow:0 3px 0 #5C1520}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(238,230,212,.35)}
.btn.ghost:active:not(:disabled){transform:none}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.btn.sm{font-size:12.5px;padding:.45em .85em;border-radius:9px}
.side .btn{font-size:13.5px}
.side .btn.sm{font-size:12.5px}

/* modal (flat, over the board) */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,7,12,.55);backdrop-filter:blur(3px);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.deed{width:min(100%,330px);background:linear-gradient(180deg,#172A63,#0D1840);border:1px solid rgba(217,178,84,.45);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.7);text-align:center;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.88) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.deed .ph-scene{aspect-ratio:3/2;position:relative}
.deed .ph-scene svg{display:block;width:100%;height:100%}
.deed .ph-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,36,86,0) 55%,#152760 100%)}
.deed-h{position:relative;margin-top:-34px;z-index:1;padding:0 14px}
.deed-h small{display:inline-block;font-size:10.5px;letter-spacing:.14em;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--gc) 60%,transparent)}
.deed-h b{display:block;font-family:var(--display);font-weight:900;font-size:26px;line-height:1.15;margin-top:6px;color:#fff}
.deed-body{padding:8px 18px 18px}
.price{font-family:var(--display);font-weight:900;font-size:24px;color:var(--gold-hi)}
.deed .acts{margin-top:14px}
.deed .acts .btn{font-size:15px}
.fate{width:min(100%,320px);border-radius:18px;padding:22px 20px 20px;text-align:center;color:#2A1806;animation:flip .55s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(165deg,#FFF6DD,#F0D69A);box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 0 0 2px var(--gold-deep),inset 0 0 0 7px #FFF6DD,inset 0 0 0 8px rgba(168,122,38,.55)}
@keyframes flip{from{transform:perspective(800px) rotateY(-100deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.fate .fi{width:64px;margin:0 auto;color:var(--gold-deep)}
.fate .fi svg{width:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fate .fi svg .f{fill:currentColor;fill-opacity:.25}
.fate small{display:block;font-size:11px;letter-spacing:.22em;color:var(--gold-deep);font-weight:800;margin:.4em 0 .6em}
.fate p{margin:0;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.35;text-wrap:balance}
.fate .who{margin-top:12px;font-size:12.5px;font-weight:700;color:#7A5A20}

/* ---------- side ---------- */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{font:inherit;font-size:12.5px;font-weight:600;display:grid;place-items:center;width:36px;height:36px;padding:0;border-radius:50%;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line)}
.tg{position:relative}.tg .lbl{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);padding:4px 9px;border-radius:8px;background:#F6DA8E;color:#2A1806;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.tg:hover .lbl,.tg:focus-visible .lbl{opacity:1}
.tg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tg[aria-pressed="true"]{color:#2A1806;background:var(--gold);border-color:var(--gold)}
.tg:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(217,178,84,.3);border-radius:18px;padding:16px 16px 18px;min-width:0;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 12px}
.ph h2{font-family:var(--display);font-weight:800;font-size:18px;margin:0;color:var(--gold-hi)}
.ph span{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pcard{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid transparent;transition:background .3s,border-color .3s}

.pcard.out{opacity:.4}
.pcard.out .pname{text-decoration:line-through}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--pc) 45%,transparent),rgba(255,255,255,.03));box-shadow:inset 0 0 0 2px var(--pc)}

.pname{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(178,58,72,.25);color:#F3A2AC}
.tag.turn{background:rgba(232,183,88,.2);color:var(--gold-hi)}
.tag.ai{background:rgba(255,255,255,.07);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chips i{width:9px;height:9px;border-radius:2px;background:var(--gc);box-shadow:0 0 5px color-mix(in srgb,var(--gc) 50%,transparent)}
.chips i.m{opacity:.3}
.chips .none{font-size:11.5px;color:var(--muted)}
.cash{text-align:right}
.cash b{display:block;font-family:var(--display);font-weight:900;font-size:19px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.cash small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.delta{position:absolute;right:12px;top:-6px;font-weight:800;font-size:13.5px;pointer-events:none;animation:rise 1.7s ease-out forwards;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
.delta.up{color:#86E0AC}.delta.down{color:#F4909E}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

.sdeed{border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#172A63,#0D1840);border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.sdeed .ph-scene{aspect-ratio:2/1;position:relative}
.sdeed .ph-scene svg{display:block;width:100%;height:100%}

.sdeed .ph-icon{aspect-ratio:3/1;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--c1,#1E2A44),var(--c2,#0F1424));color:#FFF1D2;padding:14px}
.sdeed .ph-icon svg{height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,210,120,.6))}

.sdeed .ph-icon svg .s{fill:currentColor;stroke:none}
.sdeed .deed-h{text-align:center}
.sdeed .deed-h.noimg{margin-top:12px}
.sdeed .x{position:absolute;right:10px;top:10px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(5,7,12,.55);color:#fff;font-size:15px;cursor:pointer;line-height:1}

.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;margin-top:6px}
.rt td{padding:4px 0;border-bottom:1px dashed rgba(140,150,173,.25)}
.rt td:first-child{text-align:left;color:var(--muted)}
.rt td:last-child{text-align:right;font-weight:700;color:var(--cream)}

.meta-l{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}

.owner{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;margin:4px 0 6px}
.owner i{width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc)}
.dacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dacts .btn{flex:1 1 auto}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.desc{font-size:13.5px;color:var(--muted);margin:4px 0 0;line-height:1.55;text-align:center}

.grp{margin-top:12px}.grp:first-child{margin-top:0}
.gh{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.gh i{width:10px;height:10px;border-radius:3px;background:var(--gc);box-shadow:0 0 6px var(--gc)}
.gh .cnt{margin-left:auto}

.prow{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;font:inherit;font-size:13.5px;color:var(--cream);background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:10px;padding:5px 10px 5px 5px;cursor:pointer;text-align:left;margin-bottom:5px}

.prow .th{width:34px;height:24px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px var(--gc)}
.prow .th svg{display:block;width:100%;height:100%}

.prow .flrs{display:flex;gap:2px}

.log{list-style:none;margin:0;padding:0;max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}

.log li i{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--muted));transform:translateY(1px)}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted)}

.cell.prop{--bw:18%;background:linear-gradient(var(--gdir,180deg),color-mix(in srgb,var(--gc) 42%,#0D1640) 0%,color-mix(in srgb,var(--gc) 14%,#0B1436) 55%,#0A1232 100%);
  box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--gc) 90%,transparent),inset 0 0 16px color-mix(in srgb,var(--gc) 30%,transparent)}
.cell.prop .band{position:absolute;z-index:1;margin:0;height:auto;background:var(--gc);display:flex;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 0 14px color-mix(in srgb,var(--gc) 75%,transparent),inset 0 0 0 1px rgba(255,255,255,.25)}
.cell.prop.sb{--gdir:180deg;padding-top:var(--bw)}.cell.sb .band{left:0;right:0;top:0;height:var(--bw)}
.cell.prop.st{--gdir:0deg;padding-bottom:var(--bw)}.cell.st .band{left:0;right:0;bottom:0;height:var(--bw)}

.cell.sl .band .fls,.cell.sr .band .fls{flex-direction:column}

.cell.sb.own::before{left:0;right:0;bottom:0;height:5px}.cell.st.own::before{left:0;right:0;top:0;height:5px}
.cell.sl.own::before{top:0;bottom:0;left:0;width:5px}.cell.sr.own::before{top:0;bottom:0;right:0;width:5px}

.cell.sl .cname,.cell.sr .cname,.cell.sl .cprice,.cell.sr .cprice{font-size:max(5.5px,calc(var(--u) * 1.05))}
.glegend{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:.25em .8em;max-width:96%;font-size:clamp(6.5px,1.65cqw,11px);color:#C9D2EE;font-weight:600;text-shadow:0 1px 3px #000}

.glegend i{width:1em;height:1em;border-radius:3px;background:var(--gc);box-shadow:0 0 6px var(--gc)}
.cell.prop.sel,.cell.sel{box-shadow:inset 0 0 0 3px var(--gold-hi),0 0 20px rgba(246,218,142,.55)}

.cell.obs .cprice{background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,138,156,.5);color:#FFC2CC}
.debtpill{display:inline-flex;align-items:center;padding:.5em 1em;border-radius:11px;background:rgba(196,43,78,.25);box-shadow:inset 0 0 0 1.5px #E2566C;color:#FFC2CC;font-weight:800;font-size:clamp(12px,1.05vw,16px)}

const isFresh=uid=>uid===NET.uid||(NET.pres[uid]!=null&&Date.now()-NET.pres[uid]<90000);
/* the device that keeps the game moving: host if present, otherwise the first human still online */
function isDriver(){
  if(!NET.on||!S)return false;
  const hs=S.players.filter(p=>!p.ai&&!p.out&&p.uid);
  const host=NET.lobby&&NET.lobby.host,hp=hs.find(p=>p.uid===host);
  const d=hp&&isFresh(hp.uid)?hp:hs.find(p=>isFresh(p.uid));
  return d?d.uid===NET.uid:(host===NET.uid);
}
function driverKick(){
  if(!NET.on||!S||S.phase==='over'||!isDriver())return;
  const p=cur();if(!p||!p.ai||S.modal||S.auction||S.trade)return;
  if(!['roll','end'].includes(S.phase))return;
  const v=NET.ver;if(NET.kickVer===v)return;NET.kickVer=v;
  setTimeout(()=>{if(!S||NET.ver!==v||!cur().ai||S.modal||S.auction||S.trade)return;NET.lastChange=Date.now();if(S.phase==='end')nextTurn();else if(S.phase==='roll')aiTurn()},RM?150:900);
}
function netRemovePlayer(pi,why){
  const p=S.players[pi];if(!p||p.out)return false;
  const wasTurn=S.turn===pi;
  if(S.auction){const A=S.auction;if(A.seller===pi){S.auction=null;if(S.modal&&S.modal.t==='auction')S.modal=null}else{A.passed[pi]=true;if(A.leader===pi){A.leader=-1;A.high=0}if(A.waiting===pi)A.waiting=null}}
  if(S.trade&&(S.trade.from===pi||S.trade.to===pi)){S.trade=null;if(S.modal&&S.modal.t==='trade')S.modal=null}
  settleOwed(pi);bankrupt(p,null);p.cash=0;
  log(p,`${p.name} ${why}. მისი ქონება ბანკს დაუბრუნდა`);
  if(checkOver())return true;
  if(wasTurn){S.modal=null;S.pending=null;S.debtThen=null;S.phase='end';render();nextTurn()}
  else{render();if(S.auction&&S.auction.stage==='bidding'&&S.auction.waiting==null)auctionStep()}
  return true;
}
function netQuit(){
  if(!NET.on||!S||S.phase==='over'||NET.seat<0){netLeave();return}
  const me=S.players[NET.seat];
  if(NET.lobby&&NET.lobby.host===NET.uid){const nh=S.players.find(p=>!p.ai&&!p.out&&p.uid&&p.uid!==NET.uid);if(nh)NET.db.doc('games/'+NET.code).update({host:nh.uid}).catch(()=>{})}
  if(me&&!me.out)netRemovePlayer(NET.seat,'გავიდა თამაშიდან');
  netPushNow();
  setTimeout(()=>netLeave(),600);
}

const aucUsed=pi=>!!(S.aucUsed&&S.aucUsed[pi]===S.round);
function startAuction(i){
  if(aucUsed(S.turn)){say('აუქციონი წრეში მხოლოდ ერთხელ შეიძლება. შემდეგ რაუნდში ისევ შეძლებ.');render();return}
  clearUndo();
  const seller=S.turn,c=CELLS[i];
  S.auction={i,seller,stage:'setup',start:R5(c.price*.5),step:aStep(i),high:0,leader:-1,passed:{},order:[],at:0,hist:[],maxv:{},waiting:null,note:'',custom:'',gen:Date.now()};
  S.modal={t:'auction'};render();
}
function auctionBegin(){
  S.aucUsed=S.aucUsed||{};S.aucUsed[S.auction.seller]=S.round;
  const A=S.auction,c=CELLS[A.i],minS=R5(c.price*.1);
  A.start=R5(+A.start||0);
  if(A.start<minS){A.note=`საწყისი ფასი მინიმუმ ${minS}₾ უნდა იყოს.`;render();return}
  const n=S.players.length;
  for(let k=1;k<n;k++){const qi=(A.seller+k)%n;if(!S.players[qi].out){A.order.push(qi);if(S.players[qi].ai)A.maxv[qi]=aiMax(qi,A.i)}}
  A.stage='bidding';A.note='';A.at=0;
  log(S.players[A.seller],`${S.players[A.seller].name}-მა აუქციონზე გაიტანა ${c.n}, საწყისი ფასი ${A.start}₾`);
  sfx('card');auctionStep();
}
function auctionStep(){
  const A=S.auction;if(!A||A.stage!=='bidding')return;
  const live=A.order.filter(qi=>!A.passed[qi]);
  if(!live.length||(A.leader>=0&&live.length===1&&live[0]===A.leader)){
    A.stage='decide';A.waiting=null;
    if(A.leader<0){A.stage='done';A.result={none:true};log(S.players[A.seller],`${CELLS[A.i].n}: აუქციონზე საწყის ფასად არავინ ითამაშა`);sfx('pay')}
    else sfx('build');
    render();return;
  }
  // next bidder in order who has not passed and is not the current leader
  let qi=null;
  for(let k=0;k<A.order.length;k++){const c=A.order[(A.at+k)%A.order.length];if(!A.passed[c]&&c!==A.leader){qi=c;A.at=(A.at+k+1)%A.order.length;break}}
  if(qi==null){A.stage='decide';render();return}
  const q=S.players[qi],need=aNeed(A);
  if(!q.ai){A.waiting=qi;A.custom='';A.note='';A.wKey=(A.wKey||0)+1;render();return}
  A.waiting=qi;render();
  const gen=A.gen;
  setTimeout(()=>{
    const B=S&&S.auction;if(!B||B.gen!==gen||B.stage!=='bidding')return;
    const mx=B.maxv[qi]||0;
    if(need<=mx&&need<=q.cash){
      // sometimes jump higher to scare others off
      let v=need;if(Math.random()<.25&&need+B.step*2<=mx)v=need+B.step*2;
      B.high=v;B.leader=qi;B.hist.unshift({qi,v});sfx('coin');
    }else{B.passed[qi]=true;B.hist.unshift({qi,pass:true})}
    B.waiting=null;auctionStep();
  },RM?120:750);
}
function auctionBid(qi,v){
  const A=S.auction,q=S.players[qi],need=aNeed(A);
  v=Math.floor(+v||0);
  if(v<need){A.note=`ფსონი მინიმუმ ${need}₾ უნდა იყოს.`;render();return}
  if(v>q.cash){A.note=`${q.name}-ს მხოლოდ ${q.cash}₾ აქვს.`;render();return}
  A.high=v;A.leader=qi;A.hist.unshift({qi,v});A.waiting=null;A.note='';sfx('coin');auctionStep();
}
function auctionPass(qi){const A=S.auction;A.passed[qi]=true;A.hist.unshift({qi,pass:true});A.waiting=null;A.note='';auctionStep()}
function auctionSell(){
  const A=S.auction;if(!A||A.stage!=='decide')return;
  const w=S.players[A.leader],seller=S.players[A.seller],c=CELLS[A.i],amt=A.high;
  w.cash-=amt;seller.cash+=amt;S.own[A.i].o=A.leader;flyCoins(A.leader,A.seller,amt);

/* ---- trading between players ---- */
/* trading: from round 2, one offer per player per round, at any moment of your own turn */
function canOffer(pi){if(S.phase==='debt'&&S.turn===pi)return true;return S.round>=2&&(S.offUsed||{})[pi]!==S.round}
function offerWhy(pi){return S.round<2?'ვაჭრობა იწყება პირველი სრული წრის შემდეგ (მე-2 რაუნდიდან).':'ამ რაუნდში შეთავაზება უკვე გააკეთე. შემდეგი რაუნდიდან ისევ შეძლებ.'}
function openTrade(to){
  const me=S.turn;const partners=S.players.map((q,i)=>i).filter(i=>i!==me&&!S.players[i].out);
  if(!partners.length)return;
  S.trade={from:me,to:to!=null&&partners.includes(to)?to:partners[0],give:[],get:[],cg:0,ct:0,stage:'edit',note:''};
  S.modal={t:'trade'};render();
}
function tradeVal(i,pr,receiving,T){
  const c=CELLS[i];let v=c.price*(S.own[i].m?.5:1);
  if(c.t==='p'){
    const g=groupCells(c.g);
    if(receiving){if(g.every(k=>k===i||T.give.includes(k)||(S.own[k]&&S.own[k].o===pr&&!T.get.includes(k))))v+=c.price*.8}
    else{
      if(hasSet(pr,c.g))v+=c.price;
      if(g.every(k=>k===i||T.get.includes(k)||(S.own[k]&&S.own[k].o===T.from&&!T.give.includes(k))))v+=c.price*.6;
    }
  }else if(c.t==='tr'){if(receiving)v+=trCount(pr)*40;else v+=trCount(pr)*30}
  return v;
}
function aiAccepts(T){
  const pr=T.to;let gain=T.cg-T.ct,total=T.cg+T.ct;
  T.give.forEach(i=>{const v=tradeVal(i,pr,true,T);gain+=v;total+=v});
  T.get.forEach(i=>{const v=tradeVal(i,pr,false,T);gain-=v;total+=v});
  const acc=aip().accept;
  return acc<0?gain>=total*acc:gain>=Math.max(25,total*acc);
}
function validTrade(T){
  const a=S.players[T.from],b=S.players[T.to];
  if(!T.give.length&&!T.get.length&&!T.cg&&!T.ct)return 'აირჩიე, რას აძლევ ან რას ითხოვ.';
  if(T.cg<0||T.ct<0)return 'თანხა უარყოფითი ვერ იქნება.';
  if(T.cg>Math.max(0,a.cash))return `${a.name}-ს მხოლოდ ${Math.max(0,a.cash)}₾ აქვს.`;
  if(T.ct>Math.max(0,b.cash))return canSee(T.to)?`${b.name}-ს მხოლოდ ${Math.max(0,b.cash)}₾ აქვს.`:`${b.name}-ს ამდენი ფული არ აქვს.`;
  if(T.give.concat(T.get).some(i=>S.own[i]&&S.own[i].m))return 'დაგირავებული უბანი ვერ გადაეცემა. ჯერ მფლობელმა უნდა გამოისყიდოს.';
  if(T.give.some(i=>!canTransfer(T.from,i))||T.get.some(i=>!canTransfer(T.to,i)))return 'სართულებიან ფერს ვერ გაცვლი. ჯერ სართულები გაყიდე.';
  return null;
}
function applyTrade(T){
  const a=S.players[T.from],b=S.players[T.to];
  T.give.forEach(i=>S.own[i].o=T.to);T.get.forEach(i=>S.own[i].o=T.from);
  a.cash+=T.ct-T.cg;b.cash+=T.cg-T.ct;
  if(T.cg)flyCoins(T.from,T.to,T.cg);if(T.ct)flyCoins(T.to,T.from,T.ct);
  const part=(ids,cash)=>[...ids.map(i=>CELLS[i].n),...(cash?[cash+'₾']:[])].join(', ')||'არაფერი';
  log(a,`ვაჭრობა: ${a.name} → ${b.name}: ${part(T.give,T.cg)} ↔ ${part(T.get,T.ct)}`);sfx('buy');
}
function proposeTrade(){
  const T=S.trade;if(!T)return;
  const err=validTrade(T);if(err){T.note=err;render();return}
  T.sent=true;const b=S.players[T.to];
  if(b.ai){
    if(aiAccepts(T)){snap();applyTrade(T);T.stage='result';T.ok=true;T.note=`${b.name} დათანხმდა! გარიგება შესრულდა.`}
    else{T.stage='edit';T.note=`${b.name}-ს ეს შეთავაზება არ აწყობს. შესთავაზე მეტი.`;sfx('pay')}
  }else{T.stage='confirm';T.note=''}
  render();
}

const NEWBUY={},OUT_T=new Set();let PREV_OWN=null;
function trackBuys(){
  if(!S){PREV_OWN=null;return}
  const vi=viewer(),now=CELLS.map((_,i)=>S.own[i]?S.own[i].o:-1);
  if(PREV_OWN&&PREV_OWN.length===now.length){
    const ch=now.filter((o,i)=>o!==PREV_OWN[i]).length;
    if(ch&&ch<=3)now.forEach((o,i)=>{if(o===vi&&PREV_OWN[i]!==vi){NEWBUY[i]=Date.now();setTimeout(()=>{if(S)renderCells()},2700)}});
  }
  PREV_OWN=now;

function renderCells(){
  trackBuys();

function chartSVG(){
  const H=S.hist||[];if(H.length<2)return '<p class="empty">გრაფიკი მეორე რაუნდიდან გამოჩნდება.</p>';
  const W=560,Ht=230,pl=48,pr=14,pt=12,pb=28,n=H.length,max=Math.max(500,...H.flat());
  const nice=Math.ceil(max/500)*500;
  const X=k=>pl+(W-pl-pr)*k/(n-1),Y=v=>pt+(Ht-pt-pb)*(1-Math.max(0,v)/nice);
  let g='';
  for(let t=0;t<=4;t++){const v=nice*t/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(148,161,200,.18)"/><text x="${pl-7}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#94A1C8">${Math.round(v)}</text>`}
  const step=Math.max(1,Math.ceil((n-1)/8));
  for(let k=0;k<n;k+=step)g+=`<text x="${X(k).toFixed(1)}" y="${Ht-9}" text-anchor="middle" font-size="11" fill="#94A1C8">${k+1}</text>`;
  S.players.forEach((p,i)=>{
    if(!canSee(i))return;
    const pts=H.map((row,k)=>`${X(k).toFixed(1)},${Y(row[i]??0).toFixed(1)}`).join(' ');
    const last=H[n-1][i]??0;
    g+=`<polyline points="${pts}" fill="none" stroke="${p.col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="${p.out?.4:1}"/><circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="4.5" fill="${p.col}" stroke="#fff" stroke-width="1.5"/>`;
  });
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="ქონების ღირებულება რაუნდების მიხედვით">${g}</svg></div>
    <div class="clegend">${S.players.map(p=>`<span><i style="background:${p.col}"></i>${esc(p.name)}</span>`).join('')}<span class="cx">ჰორიზონტალურად: რაუნდი · ვერტიკალურად: ქონება ₾</span></div>`;
}

  if(amt<50)return `<p class="note">მინიმალური სესხი 50₾-ია.</p>`;

    <p class="note">სრულად დააბრუნებ ${pl.paid}₾-ს (ზედმეტი ${pl.paid-a}₾), თუ ადრე არ დაფარავ. ადრე დაფარვა იაფია: პროცენტი ყოველ სვლაზე იზრდება.</p>`;

function migrateLayout(s){
  if(!s||s.v!==7)return s;
  const M={22:23,23:22,31:32,32:31},m=k=>M[k]!=null?M[k]:k;
  const own={};for(const k in s.own)own[m(+k)]=s.own[k];s.own=own;
  const cr={};for(const k in (s.cellRent||{}))cr[m(+k)]=s.cellRent[k];s.cellRent=cr;
  (s.players||[]).forEach(p=>{p.pos=m(p.pos);if(p.metroAt!=null)p.metroAt=m(p.metroAt)});
  if(s.pending!=null)s.pending=m(s.pending);if(s.sel!=null)s.sel=m(s.sel);s.mv=null;s.v=8;return s;
}

    if(!Array.isArray(s.dice)||!DROT[s.dice[0]]||!DROT[s.dice[1]])s.dice=[3,5];
    if(!Array.isArray(s.deck)||!s.deck.length||s.deck.some(k=>!CARDS[k]))s.deck=shuffle(CARDS.map((_,i)=>i));
    if(s.turn==null||!s.players[s.turn])s.turn=0;
    if(!s.offUsed||typeof s.offUsed!=='object')s.offUsed={};
    s.modal=s.phase==='over'?{t:'over'}:null;s.trade=null;s.auction=null;
    if(!Array.isArray(s.stats)||s.stats.length!==s.players.length)s.stats=s.players.map(newStat);
    if(!s.cellRent)s.cellRent={};
    if(typeof s.pot!=='number')s.pot=0;if(!s.diff)s.diff='medium';s.players.forEach(p=>{if(typeof p.loan!=='number')p.loan=0;if(p.loan>0&&!p.lrate)p.lrate=LOAN.rate});
    if(!Array.isArray(s.hist))s.hist=[];
    return s;
  }catch(e){return null}
}
function start(data){
  document.body.classList.toggle('flat',!PREF.view3d);
  S=fixState(data&&data.S);
  if(S){lastCash=S.players.map(p=>p.cash);if(!S.hist.length)recordHist()}
  buildBoard();render();applyZoom(false);
  if(S&&S.phase!=='over'){
    const p=cur();
    if(p.ai){if(S.phase==='end')setTimeout(nextTurn,500);else{S.phase='roll';setTimeout(aiTurn,600)}}
    else if(S.phase==='moving'){S.phase='roll';render()}
  }
}
window.claude?.hot?.snapshot?.(()=>({S:S&&S.phase!=='moving'&&!S.modal?S:null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
